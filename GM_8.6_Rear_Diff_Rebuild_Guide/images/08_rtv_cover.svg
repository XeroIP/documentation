<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#fff"/>
  <rect x="1" y="1" width="898" height="458" fill="none" stroke="#2B579A" stroke-width="2"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">Differential Cover — RTV Sealant Application</text>
  <!-- Cover (circle) -->
  <circle cx="320" cy="255" r="160" fill="#D0D0D0" stroke="#4A5568" stroke-width="3"/>
  <!-- Bolt holes (10) -->
  <g fill="white" stroke="#666" stroke-width="2">
    <circle cx="320" cy="107" r="7"/><circle cx="405" cy="117" r="7"/>
    <circle cx="468" cy="168" r="7"/><circle cx="478" cy="248" r="7"/>
    <circle cx="458" cy="335" r="7"/><circle cx="393" cy="395" r="7"/>
    <circle cx="320" cy="403" r="7"/><circle cx="247" cy="395" r="7"/>
    <circle cx="178" cy="340" r="7"/><circle cx="163" cy="255" r="7"/>
  </g>
  <!-- RTV bead (red dashed circle) -->
  <circle cx="320" cy="255" r="138" fill="none" stroke="#CC0000" stroke-width="4" stroke-dasharray="6,2"/>
  <!-- RTV rings around bolt holes -->
  <g fill="none" stroke="#CC0000" stroke-width="2">
    <circle cx="320" cy="107" r="12"/><circle cx="405" cy="117" r="12"/>
    <circle cx="468" cy="168" r="12"/><circle cx="478" cy="248" r="12"/>
    <circle cx="458" cy="335" r="12"/><circle cx="393" cy="395" r="12"/>
    <circle cx="320" cy="403" r="12"/><circle cx="247" cy="395" r="12"/>
    <circle cx="178" cy="340" r="12"/><circle cx="163" cy="255" r="12"/>
  </g>
  <!-- Fill plug -->
  <circle cx="320" cy="120" r="6" fill="#888" stroke="#555" stroke-width="2"/>
  <text x="200" y="82" font-size="12" fill="#1F3864">Fill Plug</text>
  <line x1="240" y1="82" x2="316" y2="115" stroke="#1F3864" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="115" y="440" font-size="11" fill="#1F3864">RTV bead (3mm, continuous, inside bolt holes)</text>
  <line x1="250" y1="432" x2="280" y2="390" stroke="#1F3864" stroke-width="0.8"/>
  <!-- Instructions -->
  <rect x="530" y="60" width="350" height="375" rx="5" fill="#D5E8F0" stroke="#2B579A" stroke-width="2"/>
  <text x="705" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B579A">RTV Application Steps</text>
  <g font-size="11" fill="#333">
    <text x="545" y="108">1. Clean housing flange AND cover</text>
    <text x="555" y="125">with scraper + brake cleaner</text>
    <text x="545" y="150">2. Apply continuous 3mm bead of</text>
    <text x="555" y="167">Permatex Ultra Grey on COVER</text>
    <text x="545" y="192">3. Go around inside each bolt hole</text>
    <text x="545" y="217">4. Do NOT use a paper gasket</text>
    <text x="545" y="242">5. Hand-start all 10 bolts</text>
    <text x="545" y="267">6. Let RTV set 5–10 minutes</text>
    <text x="545" y="292">7. Torque star pattern: 20 ft-lb</text>
    <text x="545" y="317">8. Wait 1 HOUR before adding oil</text>
  </g>
  <text x="545" y="355" font-size="11" font-weight="bold" fill="#CC0000">⚠ Do not over-torque cover bolts</text>
  <text x="555" y="375" font-size="11" fill="#CC0000">They only need 20 ft-lb!</text>
  <text x="545" y="405" font-size="11" font-weight="bold" fill="#CC0000">⚠ No paper gasket — RTV only on</text>
  <text x="555" y="422" font-size="11" fill="#CC0000">this application (GM spec)</text>
</svg>
