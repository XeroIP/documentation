<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" fill="#fff"/>
  <rect x="1" y="1" width="898" height="618" fill="none" stroke="#2B579A" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">GM 8.6" Rear Differential — Cross-Section View</text>

  <!-- Housing -->
  <rect x="80" y="70" width="740" height="440" rx="20" fill="#E8E8E8" stroke="#4A5568" stroke-width="3"/>

  <!-- Axle tubes -->
  <rect x="20" y="250" width="70" height="80" fill="#D0D0D0" stroke="#4A5568" stroke-width="2"/>
  <rect x="810" y="250" width="70" height="80" fill="#D0D0D0" stroke="#4A5568" stroke-width="2"/>

  <!-- Left axle shaft -->
  <rect x="30" y="275" width="210" height="30" fill="#B0B0B0" stroke="#666" stroke-width="2"/>
  <!-- Right axle shaft -->
  <rect x="660" y="275" width="210" height="30" fill="#B0B0B0" stroke="#666" stroke-width="2"/>

  <!-- Carrier body -->
  <ellipse cx="450" cy="290" rx="140" ry="120" fill="#D8D0C0" stroke="#8B7340" stroke-width="3"/>

  <!-- Ring gear circle -->
  <circle cx="450" cy="290" r="150" fill="none" stroke="#C0A060" stroke-width="4"/>
  <circle cx="450" cy="290" r="130" fill="none" stroke="#C0A060" stroke-width="3"/>

  <!-- Gear teeth marks around ring gear -->
  <g stroke="#8B7340" stroke-width="2">
    <line x1="450" y1="137" x2="450" y2="152"/>
    <line x1="489" y1="139" x2="486" y2="154"/>
    <line x1="527" y1="145" x2="521" y2="160"/>
    <line x1="561" y1="157" x2="553" y2="170"/>
    <line x1="590" y1="174" x2="580" y2="186"/>
    <line x1="600" y1="230" x2="588" y2="237"/>
    <line x1="600" y1="290" x2="586" y2="290"/>
    <line x1="600" y1="350" x2="588" y2="343"/>
    <line x1="590" y1="406" x2="580" y2="394"/>
    <line x1="561" y1="423" x2="553" y2="410"/>
    <line x1="527" y1="435" x2="521" y2="420"/>
    <line x1="489" y1="441" x2="486" y2="426"/>
    <line x1="450" y1="443" x2="450" y2="428"/>
    <line x1="411" y1="441" x2="414" y2="426"/>
    <line x1="373" y1="435" x2="379" y2="420"/>
    <line x1="339" y1="423" x2="347" y2="410"/>
    <line x1="310" y1="406" x2="320" y2="394"/>
    <line x1="300" y1="350" x2="312" y2="343"/>
    <line x1="300" y1="290" x2="314" y2="290"/>
    <line x1="300" y1="230" x2="312" y2="237"/>
    <line x1="310" y1="174" x2="320" y2="186"/>
    <line x1="339" y1="157" x2="347" y2="170"/>
    <line x1="373" y1="145" x2="379" y2="160"/>
    <line x1="411" y1="139" x2="414" y2="154"/>
  </g>

  <!-- Spider gears -->
  <circle cx="420" cy="290" r="18" fill="#C0A060" stroke="#8B7340" stroke-width="2"/>
  <circle cx="480" cy="290" r="18" fill="#C0A060" stroke="#8B7340" stroke-width="2"/>

  <!-- Cross pin -->
  <rect x="395" y="286" width="110" height="8" fill="#888" stroke="#555" stroke-width="1" rx="2"/>

  <!-- Side gears -->
  <ellipse cx="350" cy="290" rx="15" ry="22" fill="#C0A060" stroke="#8B7340" stroke-width="2"/>
  <ellipse cx="550" cy="290" rx="15" ry="22" fill="#C0A060" stroke="#8B7340" stroke-width="2"/>

  <!-- Carrier bearings -->
  <rect x="290" y="260" width="20" height="60" fill="#A0A0A0" stroke="#707070" stroke-width="2" rx="2"/>
  <rect x="590" y="260" width="20" height="60" fill="#A0A0A0" stroke="#707070" stroke-width="2" rx="2"/>

  <!-- Bearing caps -->
  <rect x="270" y="252" width="18" height="76" fill="#708090" stroke="#4A5568" stroke-width="2"/>
  <rect x="612" y="252" width="18" height="76" fill="#708090" stroke="#4A5568" stroke-width="2"/>
  <!-- Cap bolts -->
  <circle cx="279" cy="262" r="5" fill="#555"/>
  <circle cx="279" cy="318" r="5" fill="#555"/>
  <circle cx="621" cy="262" r="5" fill="#555"/>
  <circle cx="621" cy="318" r="5" fill="#555"/>

  <!-- Pinion yoke -->
  <polygon points="420,60 480,60 490,80 410,80" fill="#999" stroke="#555" stroke-width="2"/>

  <!-- Pinion seal -->
  <rect x="425" y="82" width="50" height="13" fill="#D04040" stroke="#900" stroke-width="2" rx="2"/>

  <!-- Pinion shaft -->
  <rect x="437" y="80" width="26" height="120" fill="#B8B8B8" stroke="#666" stroke-width="2"/>

  <!-- Front pinion bearing -->
  <rect x="428" y="97" width="44" height="16" fill="#A0A0A0" stroke="#707070" stroke-width="2"/>

  <!-- Crush sleeve -->
  <rect x="440" y="118" width="20" height="35" fill="#E8A030" stroke="#A07020" stroke-width="2"/>

  <!-- Rear pinion bearing -->
  <rect x="428" y="157" width="44" height="16" fill="#A0A0A0" stroke="#707070" stroke-width="2"/>

  <!-- Depth shim -->
  <rect x="428" y="175" width="44" height="7" fill="#FF8C00" stroke="#CC6600" stroke-width="2"/>

  <!-- Pinion gear head -->
  <ellipse cx="450" cy="195" rx="30" ry="12" fill="#C0A060" stroke="#8B7340" stroke-width="2"/>

  <!-- C-clips -->
  <rect x="225" y="300" width="15" height="16" fill="#FFD700" stroke="#AA8800" stroke-width="2" rx="2"/>
  <rect x="660" y="300" width="15" height="16" fill="#FFD700" stroke="#AA8800" stroke-width="2" rx="2"/>

  <!-- Diff cover arc -->
  <path d="M 200,510 Q 450,560 700,510" stroke="#4A5568" stroke-width="3" fill="none"/>

  <!-- LABELS with leader lines -->
  <g font-size="11" fill="#1F3864">
    <!-- Right side labels -->
    <text x="640" y="56">Pinion Yoke</text>
    <line x1="638" y1="55" x2="490" y2="68" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="490" cy="68" r="2.5" fill="#1F3864"/>

    <text x="640" y="76">Pinion Seal</text>
    <line x1="638" y1="74" x2="477" y2="88" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="477" cy="88" r="2.5" fill="#1F3864"/>

    <text x="640" y="96">Front Pinion Bearing</text>
    <line x1="638" y1="94" x2="473" y2="105" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="473" cy="105" r="2.5" fill="#1F3864"/>

    <text x="640" y="116">Crush Sleeve</text>
    <line x1="638" y1="114" x2="462" y2="135" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="462" cy="135" r="2.5" fill="#1F3864"/>

    <text x="640" y="136">Rear Pinion Bearing</text>
    <line x1="638" y1="134" x2="473" y2="165" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="473" cy="165" r="2.5" fill="#1F3864"/>

    <text x="640" y="156">Depth Shim</text>
    <line x1="638" y1="154" x2="473" y2="178" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="473" cy="178" r="2.5" fill="#1F3864"/>

    <text x="640" y="176">Pinion Gear</text>
    <line x1="638" y1="174" x2="480" y2="195" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="480" cy="195" r="2.5" fill="#1F3864"/>

    <!-- Left side labels -->
    <text x="115" y="132">Ring Gear</text>
    <line x1="170" y1="134" x2="305" y2="205" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="305" cy="205" r="2.5" fill="#1F3864"/>

    <text x="115" y="157">Carrier Assembly</text>
    <line x1="215" y1="159" x2="380" y2="240" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="380" cy="240" r="2.5" fill="#1F3864"/>

    <text x="115" y="182">Spider Gears</text>
    <line x1="190" y1="184" x2="405" y2="282" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="405" cy="282" r="2.5" fill="#1F3864"/>

    <text x="115" y="207">Cross Pin</text>
    <line x1="165" y1="209" x2="398" y2="290" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="398" cy="290" r="2.5" fill="#1F3864"/>

    <text x="115" y="232">Side Gear</text>
    <line x1="165" y1="234" x2="338" y2="280" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="338" cy="280" r="2.5" fill="#1F3864"/>

    <text x="115" y="257">Carrier Bearing</text>
    <line x1="205" y1="259" x2="292" y2="280" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="292" cy="280" r="2.5" fill="#1F3864"/>

    <text x="115" y="282">Bearing Cap</text>
    <line x1="185" y1="284" x2="272" y2="290" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="272" cy="290" r="2.5" fill="#1F3864"/>

    <!-- Bottom labels -->
    <text x="85" y="480">Left Axle Shaft</text>
    <line x1="85" y1="466" x2="150" y2="302" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="150" cy="302" r="2.5" fill="#1F3864"/>

    <text x="700" y="480">Right Axle Shaft</text>
    <line x1="700" y1="466" x2="750" y2="302" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="750" cy="302" r="2.5" fill="#1F3864"/>

    <text x="85" y="540">C-Clip</text>
    <line x1="115" y1="528" x2="232" y2="316" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="232" cy="316" r="2.5" fill="#1F3864"/>

    <text x="370" y="570">Diff Cover (RTV seal)</text>
    <line x1="450" y1="558" x2="450" y2="540" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="450" cy="540" r="2.5" fill="#1F3864"/>

    <text x="720" y="400">Housing</text>
    <line x1="718" y1="396" x2="700" y2="380" stroke="#1F3864" stroke-width="0.8"/>
    <circle cx="700" cy="380" r="2.5" fill="#1F3864"/>
  </g>
</svg>