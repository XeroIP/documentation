<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="700" fill="#fff"/>
  <rect x="1" y="1" width="898" height="698" fill="none" stroke="#2B579A" stroke-width="2"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">Ring Gear Tooth Contact Pattern Reference</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#555">Apply marking compound to 10–12 teeth, rotate through pinion, examine pattern on DRIVE side</text>

  <!-- Row function: y_offset, title, bg_color, border_color, pattern_cx, pattern_cy, pattern_rx, pattern_ry, pattern_fill, desc, fix -->

  <!-- IDEAL -->
  <rect x="20" y="65" width="860" height="115" rx="5" fill="#D5F0D5" stroke="#2B7A2B" stroke-width="2"/>
  <text x="40" y="88" font-size="14" font-weight="bold" fill="#2B7A2B">IDEAL (Correct)</text>
  <!-- Tooth shape -->
  <polygon points="370,155 390,85 530,85 550,155" fill="#F5F0E0" stroke="#8B7340" stroke-width="2"/>
  <text x="380" y="170" font-size="9" fill="#666">Toe</text>
  <text x="530" y="170" font-size="9" fill="#666">Heel</text>
  <text x="555" y="95" font-size="9" fill="#666">Face</text>
  <text x="555" y="150" font-size="9" fill="#666">Root</text>
  <ellipse cx="460" cy="120" rx="50" ry="22" fill="#4488CC" stroke="#2266AA" stroke-width="2"/>
  <text x="620" y="95" font-size="11" fill="#333">Centered, oval, 50–70% coverage</text>
  <text x="620" y="115" font-size="11" font-weight="bold" fill="#2B7A2B">Fix:</text>
  <text x="620" y="132" font-size="11" fill="#333">No adjustment needed</text>

  <!-- TOE -->
  <rect x="20" y="190" width="860" height="115" rx="5" fill="#F0EED5" stroke="#D97706" stroke-width="2"/>
  <text x="40" y="213" font-size="14" font-weight="bold" fill="#D97706">TOE Contact</text>
  <polygon points="370,280 390,210 530,210 550,280" fill="#F5F0E0" stroke="#8B7340" stroke-width="2"/>
  <text x="380" y="295" font-size="9" fill="#666">Toe</text>
  <text x="530" y="295" font-size="9" fill="#666">Heel</text>
  <text x="555" y="220" font-size="9" fill="#666">Face</text>
  <text x="555" y="275" font-size="9" fill="#666">Root</text>
  <ellipse cx="420" cy="245" rx="40" ry="20" fill="#CC8844" stroke="#AA6622" stroke-width="2"/>
  <text x="620" y="220" font-size="11" fill="#333">Pattern shifted to small end of tooth</text>
  <text x="620" y="240" font-size="11" font-weight="bold" fill="#D97706">Fix:</text>
  <text x="620" y="257" font-size="11" fill="#333">Increase backlash OR use thinner</text>
  <text x="620" y="274" font-size="11" fill="#333">pinion depth shim</text>

  <!-- HEEL -->
  <rect x="20" y="315" width="860" height="115" rx="5" fill="#F0EED5" stroke="#D97706" stroke-width="2"/>
  <text x="40" y="338" font-size="14" font-weight="bold" fill="#D97706">HEEL Contact</text>
  <polygon points="370,405 390,335 530,335 550,405" fill="#F5F0E0" stroke="#8B7340" stroke-width="2"/>
  <text x="380" y="420" font-size="9" fill="#666">Toe</text>
  <text x="530" y="420" font-size="9" fill="#666">Heel</text>
  <text x="555" y="345" font-size="9" fill="#666">Face</text>
  <text x="555" y="400" font-size="9" fill="#666">Root</text>
  <ellipse cx="510" cy="370" rx="40" ry="20" fill="#CC8844" stroke="#AA6622" stroke-width="2"/>
  <text x="620" y="345" font-size="11" fill="#333">Pattern shifted to large end of tooth</text>
  <text x="620" y="365" font-size="11" font-weight="bold" fill="#D97706">Fix:</text>
  <text x="620" y="382" font-size="11" fill="#333">Decrease backlash OR use thicker</text>
  <text x="620" y="399" font-size="11" fill="#333">pinion depth shim</text>

  <!-- FACE -->
  <rect x="20" y="440" width="860" height="115" rx="5" fill="#F0D5D5" stroke="#CC0000" stroke-width="2"/>
  <text x="40" y="463" font-size="14" font-weight="bold" fill="#CC0000">FACE Contact (High)</text>
  <polygon points="370,530 390,460 530,460 550,530" fill="#F5F0E0" stroke="#8B7340" stroke-width="2"/>
  <text x="380" y="545" font-size="9" fill="#666">Toe</text>
  <text x="530" y="545" font-size="9" fill="#666">Heel</text>
  <text x="555" y="470" font-size="9" fill="#666">Face</text>
  <text x="555" y="525" font-size="9" fill="#666">Root</text>
  <ellipse cx="460" cy="477" rx="50" ry="14" fill="#CC4444" stroke="#AA2222" stroke-width="2"/>
  <text x="620" y="470" font-size="11" fill="#333">Pattern rides high on tooth face</text>
  <text x="620" y="490" font-size="11" font-weight="bold" fill="#CC0000">Fix:</text>
  <text x="620" y="507" font-size="11" fill="#333">Use thicker pinion depth shim</text>
  <text x="620" y="524" font-size="11" fill="#333">(move pinion deeper)</text>

  <!-- FLANK -->
  <rect x="20" y="565" width="860" height="115" rx="5" fill="#F0D5D5" stroke="#CC0000" stroke-width="2"/>
  <text x="40" y="588" font-size="14" font-weight="bold" fill="#CC0000">FLANK/ROOT Contact (Low)</text>
  <polygon points="370,655 390,585 530,585 550,655" fill="#F5F0E0" stroke="#8B7340" stroke-width="2"/>
  <text x="380" y="670" font-size="9" fill="#666">Toe</text>
  <text x="530" y="670" font-size="9" fill="#666">Heel</text>
  <text x="555" y="595" font-size="9" fill="#666">Face</text>
  <text x="555" y="650" font-size="9" fill="#666">Root</text>
  <ellipse cx="460" cy="640" rx="50" ry="14" fill="#CC4444" stroke="#AA2222" stroke-width="2"/>
  <text x="620" y="595" font-size="11" fill="#333">Pattern rides low in tooth root</text>
  <text x="620" y="615" font-size="11" font-weight="bold" fill="#CC0000">Fix:</text>
  <text x="620" y="632" font-size="11" fill="#333">Use thinner pinion depth shim</text>
  <text x="620" y="649" font-size="11" fill="#333">(move pinion shallower)</text>
</svg>