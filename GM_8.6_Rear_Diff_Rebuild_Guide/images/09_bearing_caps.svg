<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="400" fill="#fff"/>
  <rect x="1" y="1" width="898" height="398" fill="none" stroke="#2B579A" stroke-width="2"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">Carrier Bearing Cap Orientation — Mark Before Removal!</text>
  <!-- Housing rear view -->
  <circle cx="400" cy="220" r="160" fill="#E8E8E8" stroke="#4A5568" stroke-width="3"/>
  <!-- Carrier bore -->
  <circle cx="400" cy="220" r="100" fill="#F0F0F0" stroke="#999" stroke-width="2"/>
  <!-- Left bearing cap -->
  <rect x="250" y="175" width="40" height="90" fill="#708090" stroke="#4A5568" stroke-width="2"/>
  <text x="270" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#CC0000">L</text>
  <circle cx="270" cy="207" r="5" fill="#555"/><circle cx="270" cy="248" r="5" fill="#555"/>
  <!-- Right bearing cap -->
  <rect x="510" y="175" width="40" height="90" fill="#708090" stroke="#4A5568" stroke-width="2"/>
  <text x="530" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#CC0000">R</text>
  <circle cx="530" cy="207" r="5" fill="#555"/><circle cx="530" cy="248" r="5" fill="#555"/>
  <!-- Housing marks -->
  <text x="300" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#CC0000">L</text>
  <text x="500" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#CC0000">R</text>
  <!-- Labels -->
  <text x="100" y="110" font-size="12" fill="#1F3864">Left Bearing Cap</text>
  <line x1="195" y1="110" x2="255" y2="175" stroke="#1F3864" stroke-width="0.8"/>
  <text x="620" y="110" font-size="12" fill="#1F3864">Right Bearing Cap</text>
  <line x1="618" y1="110" x2="545" y2="175" stroke="#1F3864" stroke-width="0.8"/>
  <text x="100" y="350" font-size="12" fill="#1F3864">Paint pen marks</text>
  <text x="100" y="367" font-size="12" fill="#1F3864">(match cap to housing)</text>
  <line x1="220" y1="348" x2="295" y2="195" stroke="#1F3864" stroke-width="0.8"/>
  <!-- Warning box -->
  <rect x="620" y="260" width="260" height="120" rx="5" fill="#F0D5D5" stroke="#CC0000" stroke-width="2"/>
  <text x="750" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#CC0000">⚠ CRITICAL</text>
  <text x="635" y="305" font-size="11" fill="#333">Caps are machined as a</text>
  <text x="635" y="323" font-size="11" fill="#333">matched set to the housing.</text>
  <text x="635" y="345" font-size="11" font-weight="bold" fill="#CC0000">NEVER swap left ↔ right.</text>
  <text x="635" y="367" font-size="11" font-weight="bold" fill="#CC0000">Mark BEFORE removal!</text>
</svg>
